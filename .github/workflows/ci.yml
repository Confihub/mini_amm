name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal --target wasm32v1-none
      - name: Build deployable contract
        run: cargo +1.91.0 build --locked --release --target wasm32v1-none
